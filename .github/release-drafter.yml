name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
commitish: 'develop'
# 릴리즈는 배포 트리거 때문에 target을 main으로 발행한다. true로 두면 target이 develop인
# 릴리즈만 이전 릴리즈로 인정해 기준점을 못 찾고, 초안에 과거 PR이 전부 딸려 들어온다.
filter-by-commitish: false
pull-request-limit: 20
history-limit: 100

categories:
  - title: '✨ Features'
    labels: ['✨ Feature']
  - title: '🐞 Bug Fixes'
    labels: ['🐞 BugFix']
  - title: '🌏 Deploy'
    labels: ['🌏 Deploy']
  - title: '🎨 UI & Styling'
    labels: ['🎨 Html&css']
  - title: '💻 Cross Browsing'
    labels: ['💻 CrossBrowsing']
  - title: '📬 API'
    labels: ['📬 API']
  - title: '🔨 Refactors'
    labels: ['🔨 Refactor']
  - title: '✅ Tests'
    labels: ['✅ Test']
  - title: '📃 Docs'
    labels: ['📃 Docs']
  - title: '⚙ Settings'
    labels: ['⚙ Setting']
  - title: '🥰 Accessibility'
    labels: ['🥰 Accessibility']

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '<*_&'

version-resolver:
  major:
    labels: ['💥 Breaking']
  minor:
    labels: ['✨ Feature']
  patch:
    labels:
      - '🐞 BugFix'
      - '🌏 Deploy'
      - '🎨 Html&css'
      - '💻 CrossBrowsing'
      - '📬 API'
      - '🔨 Refactor'
      - '✅ Test'
      - '📃 Docs'
      - '⚙ Setting'
      - '🥰 Accessibility'

  default: patch

template: |
  ## Changes
  $CHANGES
