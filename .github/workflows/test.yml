name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Jest
        id: jest
        continue-on-error: true
        run: pnpm test:ci
        env:
          CI: true

      - name: Upload coverage
        if: steps.jest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: PR 테스트 결과 코멘트
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const outcome = '${{ steps.jest.outcome }}';

            const icon = (o) =>
              o === 'success' ? '✅' : o === 'failure' ? '❌' : '⏭️';
            const label = (o) =>
              o === 'success' ? '통과' : o === 'failure' ? '실패' : '건너뜀';

            const body = [
              '## PR 테스트 결과',
              '',
              `${icon(outcome)} **Jest:** ${label(outcome)}`,
              '',
              outcome === 'success'
                ? '🎉 모든 테스트를 통과했습니다!'
                : '⚠️ 테스트에 실패했습니다. 확인 후 수정해주세요.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.findLast(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes('## PR 테스트 결과'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail workflow if tests failed
        if: always()
        run: |
          jest_outcome="${{ steps.jest.outcome }}"
          echo "Jest: ${jest_outcome}"

          if [ "${jest_outcome}" = "failure" ]; then
            echo "::error::테스트 실패"
            exit 1
          fi
