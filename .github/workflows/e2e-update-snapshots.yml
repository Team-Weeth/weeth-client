name: Update E2E Snapshots

# 스냅샷을 업데이트해야 할 때 수동으로 실행합니다.
# 실행 브랜치: Actions 탭에서 워크플로우를 트리거할 때 선택한 브랜치
#
# 언제 실행하나:
#   - ImageCard 레이아웃이 변경되어 기준 스냅샷을 새로 생성해야 할 때
#   - 처음 linux 스냅샷이 없어 CI에서 비교가 안 될 때
#
# 주의: 이 workflow를 실행하면 스냅샷이 자동 커밋됩니다.
#       의도치 않은 레이아웃 변경을 먼저 확인하고 실행하세요.

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Generate Linux Snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Update snapshots
        run: pnpm exec playwright test e2e/specs/image-card.spec.ts --project=chromium --update-snapshots
        env:
          CI: true
          DEV_ACCESS_TOKEN: ${{ secrets.DEV_ACCESS_TOKEN }}
          NEXT_PUBLIC_API_URL: https://api-dev.v4.weeth.kr

      - name: Commit updated snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'e2e/specs/image-card.spec.ts-snapshots/'
          if git diff --staged --quiet; then
            echo "변경된 스냅샷이 없습니다."
          else
            git commit -m "chore: linux e2e 스냅샷 업데이트 [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"${{ github.ref_name }}"
          fi
