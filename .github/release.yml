# generate-notes API 카테고리 설정 (release-create.yml 에서 사용)
changelog:
  exclude:
    labels:
      - '🚀 Release'
  categories:
    - title: '💥 Breaking Changes'
      labels: ['💥 Breaking']
    - title: '🚑 Hotfixes'
      labels: ['🚑 Hotfix']
    - title: '✨ Features'
      labels: ['✨ Feature']
    - title: '🐞 Bug Fixes'
      labels: ['🐞 BugFix']
    - title: '🌏 Deploy'
      labels: ['🌏 Deploy']
    - title: '🎨 UI & Styling'
      labels: ['🎨 Html&css']
    - title: '💻 Cross Browsing'
      labels: ['💻 CrossBrowsing']
    - title: '📬 API'
      labels: ['📬 API']
    - title: '🔨 Refactors'
      labels: ['🔨 Refactor']
    - title: '✅ Tests'
      labels: ['✅ Test']
    - title: '📃 Docs'
      labels: ['📃 Docs']
    - title: '⚙ Settings'
      labels: ['⚙ Setting']
    - title: '🥰 Accessibility'
      labels: ['🥰 Accessibility']
    - title: '🧩 Others'
      labels: ['*']
