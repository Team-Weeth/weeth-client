# PR head 브랜치 접두사 → 유형 라벨 (릴리즈 노트 분류용, 버전 판정과 무관)
# 접두사 없는 브랜치(WTH-xxx-...)는 라벨을 붙이지 않으므로 직접 지정한다

'✨ Feature':
  - head-branch: ['^feat/']

'🐞 BugFix':
  - head-branch: ['^fix/']

'🔨 Refactor':
  - head-branch: ['^refactor/']

'⚙ Setting':
  - head-branch: ['^chore/', '^setting/']

'📃 Docs':
  - head-branch: ['^docs/']

'✅ Test':
  - head-branch: ['^test/']

'🚑 Hotfix':
  - head-branch: ['^hotfix/']

# develop → main 릴리즈 PR (릴리즈 노트에서 제외)
'🚀 Release':
  - head-branch: ['^develop$', '^release/']
